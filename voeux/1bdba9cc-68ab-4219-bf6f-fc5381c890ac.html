      .scene-toss .wire-person { left:33%; animation: pick-up .56s ease-in-out forwards; }

      .scene-wrong .wire-person { left:var(--question-position); animation: sit-and-cry .45s ease-out forwards; }

      @keyframes sit-and-cry { to { transform:translate(-18px,48px) rotate(72deg); } }
      @keyframes tears { 50% { transform:translateY(12px); opacity:.35; } }
    

      .scene-question .sign { top:auto; bottom:191px; }
      .scene-answers .sign { display:block; top:auto; bottom:191px; left:17px; width:205px; min-height:91px; height:auto; padding:10px 12px; opacity:1; transform:rotate(-2deg); font:700 16px/1.08 Georgia,serif; animation:sign-up .35s ease-out forwards; }

      .scene-answers .arm-right { animation:raise-sign-arm .45s ease-out forwards; }
      @keyframes lower-sign-arm { from { transform:rotate(-145deg); } to { transform:rotate(-45deg); } }
      @keyframes raise-sign-arm { from { transform:rotate(-45deg); } to { transform:rotate(-145deg); } }
      .scene-wrong .sign { display:block; top:-50px; left:17px; width:205px; min-height:91px; height:auto; padding:10px 12px; opacity:1; animation:toss-sign .56s ease-in forwards; font:700 16px/1.08 Georgia,serif; }

      .scene-intro .arm-left { animation: swing-arm-left .28125s ease-in-out 8 alternate forwards; }

      @keyframes swing-arm-right { from { transform:rotate(-60deg); } to { transform:rotate(40deg); } }
      @keyframes swing-leg-left { from { transform:rotate(32deg); } to { transform:rotate(-32deg); } }

const item = {"id":"1bdba9cc-68ab-4219-bf6f-fc5381c890ac","firstName":"Essai","addressForm":"tu","correctAnswer":"Pas de souvenir en commun","sillyAnswers":["Le canard qui nous enseignait le ski nautique ?","Notre concours de chaussettes dépareillées ?","La fois où un grille-pain nous a demandé un autographe ?","Notre sieste imprévue dans un bac à glaçons ?","Notre rendez-vous secret avec trois pingouins ?","Le jour où notre plante verte a gagné au karaoké ?","La publication de notre livre \"Le mystère du croissant disparu\" ?","Le marathon que nous avons voulu faire en chaussures de ski ?","Comment a été apprécié ma recette de soupe au chocolat ?","Le pigeon qui connaissait nos prénoms ?","Nous avons adopté un kangourou avec garde alternée ?","Nous avons traversé la Manche en baignoire ?","Un raton laveur a sonné à la porte pour demander le code Wi-Fi ?","Nous voulions apprendre le japonais à une baguette de pain ?","Le jour où on a planté un réverbère pour récolter des lampadaires ?","Nous avons raté la navette pour notre pique-nique sur la lune ?"]};

let currentRound = [], remainingSillyAnswers = [], signIndex = 0, timer, slowdownTimer;

function current(){ return item; }
function shuffle(items){ return [...items].sort(() => Math.random() - .5); }
function makeRound(){
  const item = current();
  const pool = sharedSillyAnswers.length >= 3 ? sharedSillyAnswers : [...sharedSillyAnswers, ...DEFAULT_SILLY];
  const nonsense = [];
  while (nonsense.length < 3) {
    if (!remainingSillyAnswers.length) remainingSillyAnswers = shuffle(pool);
    const different = remainingSillyAnswers.findIndex(answer => !nonsense.includes(answer));
    nonsense.push(remainingSillyAnswers.splice(different < 0 ? 0 : different, 1)[0]);
  }

}
function resetPreview(){ clearTimeout(timer); cancelAnimationFrame(slowdownTimer); signIndex = 0; remainingSillyAnswers = []; currentRound = makeRound(); const stage = $("stage"); stage.className = "stage scene-intro"; const sign = $("sign"); sign.textContent = "?"; sign.onclick = null; $("answer-button").hidden = true; $("success").hidden = true; $("scene-caption").textContent = ""; timer = setTimeout(showKnock, 2300); }

}

function success(){
